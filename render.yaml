services:
  - type: web
    name: cicekcilik-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./ECommerce.WebAPI/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: SeedData__Enabled
        value: "true"
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: SeedData__AdminEmail
        sync: false
      - key: SeedData__AdminPassword
        sync: false
      - key: ConnectionStrings__VarsayilanBaglanti
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: NEON_STORAGE_BUCKET
        value: cicekcilik-uploads
      - key: NEON_PRIVATE_STORAGE_BUCKET
        value: cicekcilik-private
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: JwtSettings__Secret
        generateValue: true
      - key: JwtSettings__Issuer
        value: ECommerceApi
      - key: JwtSettings__Audience
        value: ECommerceClient
      - key: JwtSettings__ExpireDays
        value: "7"
      - key: ClientSettings__BaseUrl
        fromService:
          type: web
          name: cicekcilik-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: cicekcilik-web
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./ECommerce.WebUI/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ApiSettings__ApiBaseUrl
        fromService:
          type: web
          name: cicekcilik-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
